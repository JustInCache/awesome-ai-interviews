name: Scheduled Repository Heartbeat

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-repository-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    name: Auto commit heartbeat
    runs-on: ubuntu-latest
    if: github.repository == 'JustInCache/awesome-ai-interviews'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTO_COMMIT_TOKEN }}

      - name: Update README last updated timestamp
        shell: bash
        run: |
          timestamp="$(date -u '+%Y-%m-%d %H:%M UTC')"

          if grep -qE '^\*\*Last updated:\*\* ' README.md; then
            perl -0pi -e "s/\\*\\*Last updated:\\*\\* .*/**Last updated:** ${timestamp}/" README.md
          else
            perl -0pi -e "s/^(# .+\\n)/\$1\\n**Last updated:** ${timestamp}\\n/" README.md
          fi

      - name: Commit README update when changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update repository freshness date"
          file_pattern: README.md
          commit_user_name: JustInCache
          commit_user_email: JustInCache@users.noreply.github.com
          commit_author: JustInCache <JustInCache@users.noreply.github.com>
